<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>MyVault - offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #0f172a; font-family: system-ui, sans-serif; }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #64748b; font-size: .95rem; line-height: 1.5; }
    a { display: inline-block; margin-top: 1rem; padding: .6rem 1.2rem; border-radius: .5rem; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="84" height="84" alt="" style="border-radius:20px">
    <h1>You're offline</h1>
    <p>MyVault keeps no copy of your vault on this device when you're offline. Reconnect to unlock your items.</p>
    <a href="/dashboard">Try again</a>
  </main>
</body>
</html>
